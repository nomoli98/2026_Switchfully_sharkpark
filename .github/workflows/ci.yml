on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Make Maven wrapper executable
        shell: bash
        run: |
          if [ -f mvnw ]; then
            chmod +x mvnw
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Build, test, check coverage and generate report
        run: ./mvnw -B clean jacoco:prepare-agent verify jacoco:report verify

